<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cert Ledger</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6b6b6b;
  --faint: #a3a3a3;
  --line: #e7e7e7;
  --fill: #f5f5f5;
  --right: #1e6b40;
  --wrong: #a3392a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --fg: #ececec;
    --muted: #9b9b9b;
    --faint: #5f5f5f;
    --line: #242424;
    --fill: #171717;
    --right: #6cc293;
    --wrong: #e5806f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 20px; }

header { border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; }
.name { font-weight: 600; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
.name span { color: var(--muted); font-weight: 400; margin-left: 6px; }
nav { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
nav a { text-decoration: none; color: var(--muted); font-size: 14px; white-space: nowrap; padding: 4px 0; }
nav a.on { color: var(--fg); }
nav a sup { font-size: 11px; margin-left: 2px; }
@media (max-width: 600px) {
  .bar { height: auto; flex-direction: column; align-items: flex-start; gap: 6px; padding-top: 14px; padding-bottom: 10px; }
  nav { max-width: 100%; }
}
main.wrap { padding-top: 36px; padding-bottom: 96px; }

h1 { font-size: 26px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; margin: 0 0 8px; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 44px 0 14px; }
p { margin: 0 0 14px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 40px; padding: 0 16px; border-radius: 6px; font-size: 15px; font-weight: 500;
  border: 1px solid var(--line); text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .88; }
.btn.off { opacity: .35; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.link { color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.link:hover { color: var(--fg); }

/* Numbers row */
.nums { display: flex; gap: 32px; flex-wrap: wrap; }
.nums div b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.nums div span { font-size: 13px; color: var(--muted); }

/* Bars */
.bars .b { display: grid; grid-template-columns: 1fr 44px; gap: 4px 14px; padding: 8px 0; }
.bars .b .t { font-size: 14px; }
.bars .b .t span { color: var(--faint); margin-left: 6px; }
.bars .b .p { font-size: 14px; text-align: right; grid-row: span 2; align-self: center; }
.track { height: 3px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--fg); }

/* Lists */
.list { border-top: 1px solid var(--line); }
.item { display: flex; gap: 16px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
a.item:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.item .c { width: 34px; flex: none; color: var(--muted); font-size: 14px; }
.item .t { flex: 1; }
.item .t small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.item .s { color: var(--muted); font-size: 13px; white-space: nowrap; }
.item.dim .t, .item.dim .c { color: var(--faint); }
.dhead { display: flex; justify-content: space-between; gap: 12px; margin: 40px 0 10px; font-size: 14px; font-weight: 500; }
.dhead span { color: var(--muted); font-weight: 400; }

/* Objective */
.back { font-size: 14px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--fg); }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin: 26px 0 30px; }
.tabs a { text-decoration: none; color: var(--muted); font-size: 15px; padding: 0 0 10px; margin-bottom: -1px; border-bottom: 1px solid transparent; }
.tabs a.on { color: var(--fg); border-bottom-color: var(--fg); }

.lesson { font-size: 17px; line-height: 1.7; }
.lesson b { font-weight: 600; }
.lesson h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 40px 0 10px; }
.lesson h3:first-child { margin-top: 0; }
.lesson ul { margin: 0; padding-left: 20px; }
.lesson li { margin-bottom: 6px; }
.quote { border-left: 2px solid var(--line); padding-left: 16px; color: var(--muted); }
dl.terms { margin: 0; font-size: 15px; line-height: 1.5; }
dl.terms div { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
dl.terms dt { font-weight: 500; }
dl.terms dd { margin: 0; color: var(--muted); }
@media (max-width: 600px) { dl.terms div { grid-template-columns: 1fr; gap: 2px; } }
.srcs { font-size: 14px; line-height: 1.5; }
.srcs li { margin-bottom: 4px; }
.srcs a { color: var(--muted); }

/* Swipe */
.stage { position: relative; height: 360px; max-width: 440px; margin: 0 auto; }
.card {
  position: absolute; inset: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  padding: 24px; display: flex; flex-direction: column; touch-action: none; user-select: none; cursor: grab;
}
.card.under { transform: translateY(8px) scale(.97); opacity: .5; }
.card .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--faint); }
.card .q { font-size: 21px; line-height: 1.35; font-weight: 500; margin-top: 22px; }
.card .a { font-size: 17px; line-height: 1.5; color: var(--muted); margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.card .hint { margin-top: auto; font-size: 13px; color: var(--faint); text-align: center; }
.tag { position: absolute; top: 22px; font-size: 13px; font-weight: 600; opacity: 0; }
.tag.yes { right: 24px; color: var(--right); }
.tag.no { left: 24px; color: var(--wrong); }
.under-stage { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
.under-stage .btn { min-width: 120px; }
.keys { text-align: center; font-size: 12px; color: var(--faint); margin-top: 12px; }

/* Quiz */
.steps { display: flex; gap: 4px; margin-bottom: 22px; }
.steps i { flex: 1; height: 2px; background: var(--line); }
.steps i.done { background: var(--fg); }
.steps i.miss { background: var(--wrong); }
.qq { font-size: 20px; line-height: 1.4; font-weight: 500; margin: 6px 0 20px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; gap: 12px; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .L { color: var(--faint); width: 14px; flex: none; }
.opt.right { border-color: var(--right); color: var(--right); }
.opt.wrong { border-color: var(--wrong); color: var(--wrong); }
.opt:disabled { cursor: default; }
.why { margin-top: 16px; font-size: 15px; color: var(--muted); }
.why b { color: var(--fg); font-weight: 600; }
.score { font-size: 48px; font-weight: 500; letter-spacing: -.03em; line-height: 1; margin-bottom: 14px; }
.score span { font-size: 18px; color: var(--muted); margin-left: 4px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; max-width: calc(100% - 40px); }
.toast.on { opacity: 1; }
footer { padding: 0 0 40px; font-size: 12px; color: var(--faint); }
table.facts { width: 100%; border-collapse: collapse; font-size: 15px; }
table.facts td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.facts td:first-child { color: var(--muted); width: 40%; }
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="name" href="#/today">Cert Ledger<span id="examName"></span></a>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap">Independent study notes, researched from the sources listed on each lesson and written to the published CompTIA exam objectives. Not affiliated with or endorsed by CompTIA. Progress is saved in this browser; back it up from Progress.</footer>
<div class="toast" id="toast"></div>

<script src="data/certs.js"></script>
<script src="data/objectives.js"></script>
<script src="data/sy0-701.js"></script>
<script src="data/fc0-u71.js"></script>
<script src="data/220-1201.js"></script>
<script src="data/diagnostic.js"></script>
<script>
(() => {
const CERTS = window.CERTS, CONTENT = window.CONTENT || {}, OBJECTIVES = window.OBJECTIVES || {};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAY = 864e5;
const today = () => new Date().toISOString().slice(0, 10);
const INTERVAL = [0, 0, 1, 3, 7, 14]; // days until due, by box 1..5

// ---------- Active exam ----------
const allExams = CERTS.flatMap(c => c.exams.map(e => ({ ...e, cert: c })));
let activeCode = "SY0-701";
try { activeCode = localStorage.getItem("certledger.active") || activeCode; } catch {}
if (!allExams.some(e => e.code === activeCode)) activeCode = "SY0-701";
const X = allExams.find(e => e.code === activeCode);
const C = CONTENT[activeCode] || { objectives: [] };
const DIAG = (window.DIAGNOSTICS || {})[activeCode];
const DOMAINS = X.domains.map(([name, weight], i) => ({ id: i + 1, name, weight }));
// Official objective list, with any written lessons merged in by id.
const written = Object.fromEntries(C.objectives.map(o => [o.id, o]));
const OBJS = (OBJECTIVES[activeCode] || C.objectives.map(o => [o.id, o.short, o.title]))
  .map(([id, short, title]) => ({ id, short, title, domain: parseInt(id), ...(written[id] || {}) }));
const lessonCount = code => ((CONTENT[code] || {}).objectives || []).filter(o => o.lesson).length;
const objCount = code => (OBJECTIVES[code] || (CONTENT[code] || {}).objectives || []).length;
const OBJ = Object.fromEntries(OBJS.map(o => [o.id, o]));
const ready = o => !!(o.lesson && o.cards && o.quiz);

// ---------- State ----------
const KEY = "certledger." + activeCode;
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { S = {}; }
S = Object.assign({ days: {}, read: {}, quiz: {}, cards: {}, mistakes: {}, flags: {}, diag: null }, S);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const studied = () => { S.days[today()] = (S.days[today()] || 0) + 1; save(); };
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200);
}

// ---------- Derived ----------
const cardKey = (id, i) => id + "#" + i;
const cardState = (id, i) => S.cards[cardKey(id, i)] || { box: 0, due: 0 };
function dueCards() {
  const now = Date.now(), out = [];
  for (const o of OBJS) if (ready(o)) o.cards.forEach((c, i) => { const s = cardState(o.id, i); if (s.box > 0 && s.due <= now) out.push([o.id, i]); });
  return out;
}
function status(o) {
  if (!ready(o)) return "locked";
  const q = S.quiz[o.id];
  const strong = o.cards.filter((c, i) => cardState(o.id, i).box >= 3).length / o.cards.length;
  if (q && q.best >= 80 && strong >= .7) return "solid";
  if (q) return "quizzed";
  if (S.read[o.id] || o.cards.some((c, i) => cardState(o.id, i).box > 0)) return "started";
  return "new";
}
const domainScore = d => { const os = OBJS.filter(o => o.domain === d); return os.reduce((a, o) => a + (S.quiz[o.id] ? S.quiz[o.id].best : 0), 0) / os.length; };
const readiness = () => DOMAINS.reduce((a, d) => a + domainScore(d.id) * d.weight / 100, 0);
function accuracy() { const qs = Object.values(S.quiz); return qs.length ? qs.reduce((a, q) => a + q.last, 0) / qs.length : null; }
function daysInLast(n) { let c = 0; for (let i = 0; i < n; i++) if (S.days[new Date(Date.now() - i * DAY).toISOString().slice(0, 10)]) c++; return c; }
const nextObjective = () => OBJS.find(o => ready(o) && status(o) !== "solid") || OBJS.find(o => !ready(o));

// ---------- Router ----------
const routes = { today: viewToday, map: viewMap, obj: viewObj, review: viewReview, diag: viewDiag, progress: viewProgress, certs: viewCerts };
const go = h => { location.hash = h; };
let cleanups = [];
function render() {
  cleanups.forEach(f => f()); cleanups = [];
  const [r, ...args] = (location.hash.slice(2) || "today").split("/");
  const n = dueCards().length + Object.keys(S.mistakes).length;
  const tabs = [["today", "Today"], ["map", "Objectives"], ["review", "Review", n], ["certs", "Certs"], ["progress", "Progress"]];
  $("#nav").innerHTML = tabs.map(([k, l, c]) => `<a href="#/${k}" class="${r === k || (r === "obj" && k === "map") || (r === "diag" && k === "today") ? "on" : ""}">${l}${c ? `<sup>${c}</sup>` : ""}</a>`).join("");
  $("#examName").textContent = X.cert.name.replace("CompTIA ", "") + " " + X.code;
  (routes[r] || viewToday)(...args);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

const bars = rows => `<div class="bars">${rows.map(([t, sub, pct]) => `<div class="b"><div class="t">${esc(t)}${sub ? `<span>${esc(sub)}</span>` : ""}</div><div class="p">${Math.round(pct)}%</div><div class="track"><i style="width:${pct}%"></i></div></div>`).join("")}</div>`;

// ---------- Today ----------
function viewToday() {
  const n = nextObjective(), acc = accuracy(), due = dueCards().length;
  let next;
  if (!OBJS.some(ready)) next = `<div class="label">${esc(X.cert.name)} ${X.code}</div><h1>No lessons written yet</h1><p class="muted">The ${OBJS.length} official objectives are listed under Objectives. Ask Claude in the project to research and write Domain 1, then come back here.</p><div class="row"><a class="btn primary" href="#/map">See the objectives</a><a class="btn" href="#/certs">Switch exam</a></div>`;
  else if (DIAG && !S.diag) next = `<div class="label">Start here</div><h1>Take the diagnostic</h1><p class="muted">25 questions. Shows where you're starting in each domain, and whether your networking is ready for Security+.</p><a class="btn primary" href="#/diag">Start</a>`;
  else if (n && ready(n)) {
    const st = status(n), mode = st === "new" ? "read" : st === "started" ? "swipe" : "quiz";
    next = `<div class="label">Next · ${n.id}</div><h1>${esc(n.short)}</h1><p class="muted">${esc(n.title)}</p>
      <div class="row"><a class="btn primary" href="#/obj/${n.id}/${mode}">${{ read: "Read the lesson", swipe: "Swipe the cards", quiz: "Take the quiz" }[mode]}</a>${due ? `<a class="btn" href="#/review/cards">${due} card${due > 1 ? "s" : ""} due</a>` : ""}</div>`;
  } else next = `<div class="label">Up to date</div><h1>You've covered everything written so far</h1><p class="muted">Ask Claude in the project to research and write the next domain${n ? `, starting at ${n.id} ${esc(n.short)}` : ""}.</p>${due ? `<a class="btn primary" href="#/review/cards">${due} cards due</a>` : ""}`;
  $("#main").innerHTML = `${next}
    <h2>Last 14 days</h2>
    <div class="nums">
      <div><b>${daysInLast(14)}</b><span>study days (aim 8+)</span></div>
      <div><b>${acc == null ? "–" : Math.round(acc) + "%"}</b><span>quiz accuracy (aim 75%+)</span></div>
      <div><b>${OBJS.filter(o => status(o) === "solid").length}/${OBJS.length}</b><span>objectives solid</span></div>
    </div>
    <h2>Readiness</h2>${readinessBlock()}`;
}
function readinessBlock() {
  return bars([...DOMAINS.map(d => [d.name, d.weight + "%", domainScore(d.id)]), ["Overall", "", readiness()]]) +
    `<p class="small faint" style="margin-top:12px">Best quiz score per objective, weighted by each domain's share of the exam. Untested objectives count as zero.</p>`;
}

// ---------- Objectives ----------
const STATUS_TEXT = { new: "", started: "Started", quizzed: "Quizzed", solid: "Solid", locked: "Not written" };
function viewMap() {
  $("#main").innerHTML = `<h1>Objectives</h1><p class="muted">${OBJS.length} objectives in ${DOMAINS.length} domains. Lessons are researched and written one domain ahead of you.</p>
    ${DOMAINS.map(d => `<div class="dhead">${d.id}. ${esc(d.name)}<span>${d.weight}%</span></div><div class="list">
      ${OBJS.filter(o => o.domain === d.id).map(o => { const s = status(o);
        return s === "locked" ? `<div class="item dim"><span class="c">${o.id}</span><span class="t">${esc(o.short)}</span><span class="s">Not written</span></div>`
          : `<a class="item" href="#/obj/${o.id}/read"><span class="c">${o.id}</span><span class="t">${esc(o.short)}${S.flags[o.id] ? ' <span class="faint">· flagged</span>' : ""}</span><span class="s">${STATUS_TEXT[s]}</span></a>`; }).join("")}
    </div>`).join("")}`;
}

function viewObj(id, mode = "read") {
  const o = OBJ[id];
  if (!o || !ready(o)) return go("#/map");
  $("#main").innerHTML = `<a class="back" href="#/map">← Objectives</a>
    <div class="label" style="margin-top:24px">${o.id} · Domain ${o.domain}</div><h1>${esc(o.title)}</h1>
    <div class="tabs">${[["read", "Read"], ["swipe", "Cards"], ["quiz", "Quiz"]].map(([k, l]) => `<a href="#/obj/${id}/${k}" class="${mode === k ? "on" : ""}">${l}</a>`).join("")}</div>
    <div id="pane"></div>`;
  ({ read: paneRead, swipe: paneSwipe, quiz: paneQuiz }[mode] || paneRead)(o, $("#pane"));
}

function paneRead(o, el) {
  const L = o.lesson, d = DOMAINS[o.domain - 1];
  el.innerHTML = `<article class="lesson">
    <h3>Explanation</h3>${L.explain.map(p => `<p>${p}</p>`).join("")}
    <h3>Example</h3><p class="quote">${esc(L.example)}</p>
    <h3>Analogy</h3><p class="quote">${esc(L.analogy)}</p>
    <h3>Key terms</h3><dl class="terms">${L.terms.map(([t, x]) => `<div><dt>${esc(t)}</dt><dd>${esc(x)}</dd></div>`).join("")}</dl>
    <h3>Summary</h3><ul>${L.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h3>Exam relevance</h3><p class="small muted">Objective ${o.id}, Domain ${d.id} ${esc(d.name)}, ${d.weight}% of ${esc(X.cert.name)} ${X.code}. Researched ${C.checked || ""}.</p>
    <h3>Sources</h3><ul class="srcs">${(o.sources || []).map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("")}</ul>
    <h3>Explain it differently</h3><p class="small muted">Copies a prompt with this lesson in it, to paste into Claude.</p>
    <div class="row"><button class="btn" data-ask="simple">Simpler</button><button class="btn" data-ask="technical">More technical</button><button class="btn" data-ask="scenario">New scenarios</button></div>
  </article>
  <div class="row" style="margin-top:44px"><button class="btn primary" id="done">${S.read[o.id] ? "Go to cards" : "Mark as read"}</button><button class="btn" id="flag">${S.flags[o.id] ? "Unflag" : "Flag as hard"}</button></div>`;
  $("#done").onclick = () => { S.read[o.id] = S.read[o.id] || today(); save(); go(`#/obj/${o.id}/swipe`); };
  $("#flag").onclick = () => { S.flags[o.id] ? delete S.flags[o.id] : (S.flags[o.id] = today()); save(); paneRead(o, el); };
  el.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => askClaude(o, b.dataset.ask));
}
function askClaude(o, kind) {
  const how = {
    simple: "Explain this as if I've never used a computer network before. Use everyday examples.",
    technical: "Give me a more technical explanation suitable for the exam, including the distinctions the exam likes to test.",
    scenario: "Give me 3 new exam-style scenario questions on this, one at a time. Wait for my answer before revealing each explanation.",
  }[kind];
  const text = `I'm studying for ${X.cert.name} (${X.code}), objective ${o.id}: ${o.title}\n\n${how}\n\nKeep the facts consistent with the official exam objectives. My current notes:\n\n${o.lesson.explain.map(s => s.replace(/<[^>]+>/g, "")).join("\n\n")}`;
  const ok = () => toast("Prompt copied. Paste it into Claude.");
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch { toast("Couldn't copy"); } t.remove(); };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(ok, fallback) : fallback();
}

// ---------- Cards ----------
function schedule(id, i, knew) {
  const s = cardState(id, i);
  const box = knew ? Math.min(5, Math.max(1, s.box) + 1) : 1;
  S.cards[cardKey(id, i)] = { box, due: Date.now() + INTERVAL[box] * DAY - (box <= 1 ? 0 : 3600e3) };
  save();
}
function paneSwipe(o, el) {
  const now = Date.now(), all = o.cards.map((c, i) => [o.id, i]);
  const deck = all.filter(([id, i]) => { const s = cardState(id, i); return s.box === 0 || s.due <= now; })
    .sort((a, b) => cardState(...a).due - cardState(...b).due);
  runSwipe(el, deck.length ? deck : all, () => `<div class="row" style="justify-content:center"><a class="btn primary" href="#/obj/${o.id}/quiz">Take the quiz</a><a class="btn" href="#/obj/${o.id}/swipe">Go again</a></div>`);
}
function runSwipe(el, deck, after) {
  let idx = 0, flipped = false, got = 0, again = [], first = true;
  const draw = () => {
    if (idx >= deck.length) {
      if (again.length) { deck = again; again = []; idx = 0; return draw(); }
      el.innerHTML = `<div style="text-align:center;max-width:440px;margin:0 auto"><div class="score">${got}<span>cards</span></div><p class="muted">Done. Cards you knew come back in a day or more; the rest sooner.</p>${after()}</div>`;
      return;
    }
    const [id, i] = deck[idx], c = OBJ[id].cards[i];
    el.innerHTML = `<div class="stage">${deck[idx + 1] ? `<div class="card under"></div>` : ""}
      <div class="card" id="card"><span class="tag yes">Got it</span><span class="tag no">Again</span>
        <div class="meta"><span>${id}</span><span>${idx + 1} / ${deck.length}</span></div>
        <div class="q">${esc(c.q)}</div>${flipped ? `<div class="a">${esc(c.a)}</div>` : ""}
        <div class="hint">${flipped ? "Swipe right if you knew it, left if not" : "Answer in your head, then tap"}</div></div></div>
      <div class="under-stage">${flipped ? `<button class="btn" id="no">Again</button><button class="btn primary" id="yes">Got it</button>` : `<button class="btn primary" id="flip">Show answer</button>`}</div>
      <div class="keys">Space to show · ← again · → got it</div>`;
    const card = $("#card");
    if (!flipped) card.onclick = $("#flip").onclick = flip;
    else { $("#no").onclick = () => decide(false); $("#yes").onclick = () => decide(true); drag(card); }
  };
  const flip = () => { flipped = true; draw(); };
  const decide = knew => {
    if (first) { studied(); first = false; }
    schedule(...deck[idx], knew);
    knew ? got++ : again.push(deck[idx]);
    const card = $("#card");
    if (card) { card.style.transition = "transform .22s ease, opacity .22s"; card.style.transform = `translateX(${knew ? 480 : -480}px) rotate(${knew ? 10 : -10}deg)`; card.style.opacity = 0; }
    setTimeout(() => { idx++; flipped = false; draw(); }, 180);
  };
  function drag(card) {
    let x0 = null, dx = 0;
    card.onpointerdown = e => { x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; };
    card.onpointermove = e => {
      if (x0 == null) return; dx = e.clientX - x0;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 26}deg)`;
      $(".tag.yes", card).style.opacity = Math.max(0, dx / 100); $(".tag.no", card).style.opacity = Math.max(0, -dx / 100);
    };
    card.onpointerup = () => {
      if (x0 == null) return; x0 = null;
      if (Math.abs(dx) > 100) decide(dx > 0);
      else { card.style.transition = "transform .2s"; card.style.transform = ""; card.querySelectorAll(".tag").forEach(t => t.style.opacity = 0); }
      dx = 0;
    };
  }
  const onKey = e => {
    if (idx >= deck.length) return;
    if (e.key === " ") { e.preventDefault(); if (!flipped) flip(); }
    else if (flipped && e.key === "ArrowRight") decide(true);
    else if (flipped && e.key === "ArrowLeft") decide(false);
  };
  document.addEventListener("keydown", onKey); cleanups.push(() => document.removeEventListener("keydown", onKey));
  draw();
}

// ---------- Quiz ----------
function paneQuiz(o, el) {
  runQuiz(el, o.quiz.map((q, i) => ({ ...q, src: o.id, i })), res => {
    const pct = Math.round(100 * res.filter(Boolean).length / res.length), prev = S.quiz[o.id];
    S.quiz[o.id] = { best: Math.max(pct, prev ? prev.best : 0), last: pct, attempts: (prev ? prev.attempts : 0) + 1, date: today() };
    save();
    return `<div class="score">${pct}<span>%</span></div>
      <p class="muted">${pct >= 80 ? "Strong." : pct >= 60 ? "Close. Retry the misses from Review, then again tomorrow." : "Not there yet. Reread and do the cards before retrying."} Best so far ${S.quiz[o.id].best}%.${status(o) === "solid" ? " This objective is now solid." : ""}</p>
      <div class="row"><a class="btn primary" href="#/today">Continue</a><a class="btn" href="#/obj/${o.id}/quiz">Retry</a></div>`;
  });
}
function runQuiz(el, qs, finish, isDiag) {
  let k = 0; const res = [];
  const draw = () => {
    if (k >= qs.length) { el.innerHTML = finish(res); return; }
    const q = qs[k];
    el.innerHTML = `<div class="steps">${qs.map((_, j) => `<i class="${j < k ? (res[j] ? "done" : "miss") : ""}"></i>`).join("")}</div>
      <div class="label">${q.src ? q.src + " · " : ""}Question ${k + 1} of ${qs.length}</div>
      <p class="qq">${esc(q.q)}</p>
      <div class="opts">${q.options.map((op, j) => `<button class="opt" data-j="${j}"><span class="L">${"ABCD"[j]}</span><span>${esc(op)}</span></button>`).join("")}</div>
      <div id="after"></div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.j));
  };
  const answer = j => {
    const q = qs[k], ok = j === q.answer; res[k] = ok;
    if (k === 0 && !isDiag) studied();
    el.querySelectorAll(".opt").forEach((b, x) => { b.disabled = true; if (x === q.answer) b.classList.add("right"); else if (x === j) b.classList.add("wrong"); });
    if (q.src) { const mk = q.src + "?" + q.i; ok ? delete S.mistakes[mk] : (S.mistakes[mk] = today()); save(); }
    $("#after").innerHTML = `<p class="why"><b>${ok ? "Correct." : "Not quite."}</b> ${esc(q.why)}</p><button class="btn primary" id="nx">${k + 1 < qs.length ? "Next" : "See result"}</button>`;
    $("#nx").onclick = () => { k++; draw(); }; $("#nx").focus();
  };
  draw();
}

// ---------- Review ----------
function viewReview(sub) {
  const due = dueCards(), miss = Object.keys(S.mistakes), flags = Object.keys(S.flags);
  if (sub === "cards") {
    $("#main").innerHTML = `<a class="back" href="#/review">← Review</a><h1 style="margin:24px 0 28px">Due cards</h1><div id="pane"></div>`;
    if (!due.length) return void ($("#pane").innerHTML = `<p class="muted">Nothing due. Come back tomorrow.</p>`);
    return runSwipe($("#pane"), due, () => `<a class="btn primary" href="#/today">Continue</a>`);
  }
  if (sub === "mistakes") {
    $("#main").innerHTML = `<a class="back" href="#/review">← Review</a><h1 style="margin:24px 0 28px">Retry mistakes</h1><div id="pane"></div>`;
    const qs = miss.map(m => { const [id, i] = m.split("?"); return { ...OBJ[id].quiz[+i], src: id, i: +i }; });
    if (!qs.length) return void ($("#pane").innerHTML = `<p class="muted">No mistakes to retry.</p>`);
    return runQuiz($("#pane"), qs, r => `<div class="score">${r.filter(Boolean).length}<span>/ ${r.length}</span></div><p class="muted">${Object.keys(S.mistakes).length} left on the list.</p><a class="btn primary" href="#/review">Back to review</a>`);
  }
  $("#main").innerHTML = `<h1>Review</h1><p class="muted">Cards come back just before you'd forget them. Questions you got wrong stay here until you get them right.</p>
    <div class="row" style="margin-top:20px"><a class="btn primary ${due.length ? "" : "off"}" href="#/review/cards">${due.length} due card${due.length === 1 ? "" : "s"}</a><a class="btn ${miss.length ? "" : "off"}" href="#/review/mistakes">Retry ${miss.length} mistake${miss.length === 1 ? "" : "s"}</a></div>
    <h2>Mistakes</h2><div class="list">${miss.length ? miss.map(m => { const [id, i] = m.split("?"), q = OBJ[id].quiz[+i]; return `<div class="item"><span class="c">${id}</span><span class="t">${esc(q.q)}<small>${esc(q.options[q.answer])}. ${esc(q.why)}</small></span></div>`; }).join("") : `<p class="muted small" style="padding-top:12px">None yet.</p>`}</div>
    <h2>Flagged as hard</h2><div class="list">${flags.length ? flags.map(id => `<a class="item" href="#/obj/${id}/read"><span class="c">${id}</span><span class="t">${esc(OBJ[id].short)}</span></a>`).join("") : `<p class="muted small" style="padding-top:12px">Nothing flagged.</p>`}</div>`;
}

// ---------- Diagnostic (Security+) ----------
const AREAS = [["net", "Networking basics"], ...DOMAINS.map(d => [d.id, d.name])];
function viewDiag(sub) {
  if (!DIAG) return go("#/today");
  if (sub === "run") {
    $("#main").innerHTML = `<a class="back" href="#/diag">← Diagnostic</a><h1 style="margin:24px 0 28px">Diagnostic</h1><div id="pane"></div>`;
    return runQuiz($("#pane"), DIAG, res => {
      const scores = {};
      AREAS.forEach(([a]) => { const idx = DIAG.map((q, i) => q.area === a ? i : -1).filter(i => i >= 0); scores[a] = Math.round(100 * idx.filter(i => res[i]).length / idx.length); });
      S.diag = { date: today(), scores }; save(); setTimeout(() => go("#/diag"), 0); return "";
    }, true);
  }
  if (!S.diag) {
    $("#main").innerHTML = `<h1>Diagnostic</h1><p class="muted">25 questions: 5 networking basics and 4 from each Security+ domain. About 15 minutes, once.</p>
      <p>It tells you whether your networking is strong enough to go straight into Security+, and which domains already feel familiar.</p><a class="btn primary" href="#/diag/run">Start</a>`;
    return;
  }
  const sc = S.diag.scores, weakest = DOMAINS.slice().sort((a, b) => sc[a.id] - sc[b.id])[0];
  const verdict = sc.net < 60
    ? ["Shore up networking first", `You scored ${sc.net}% on networking basics. Security+ assumes you know ports, protocols and subnets. Ask Claude in the project for a networking-basics pack from Network+ (N10-009), and work through it alongside Domain 1.`]
    : ["Go straight into Security+", `Your networking (${sc.net}%) is ready. Start at 1.1. Your weakest area is ${weakest.name}, ${weakest.weight}% of the exam.`];
  $("#main").innerHTML = `<div class="label">Diagnostic · ${S.diag.date}</div><h1>${verdict[0]}</h1><p class="muted">${esc(verdict[1])}</p>
    <h2>Scores</h2>${bars(AREAS.map(([a, l]) => [l, "", sc[a]]))}
    <p class="small faint" style="margin-top:12px">Four or five questions per area: a rough starting point.</p>
    <div class="row" style="margin-top:28px"><a class="btn primary" href="#/today">Start studying</a><a class="btn" href="#/diag/run">Retake</a></div>`;
}

// ---------- Certifications ----------
function viewCerts(id) {
  if (id) {
    const c = CERTS.find(x => x.id === id); if (!c) return go("#/certs");
    $("#main").innerHTML = `<a class="back" href="#/certs">← Certifications</a>
      <div class="label" style="margin-top:24px">${esc(c.level)}</div><h1>${esc(c.name)}</h1><p class="muted">${esc(c.for)}</p>
      ${c.exams.map(e => `<h2>${e.code}${e.label ? " · " + esc(e.label) : ""}</h2>
        <table class="facts"><tr><td>Questions</td><td>Up to ${e.questions}</td></tr><tr><td>Time</td><td>${e.minutes} minutes</td></tr><tr><td>Pass mark</td><td>${esc(e.pass)}</td></tr><tr><td>Launched</td><td>${esc(e.launched)}</td></tr>${e.retires ? `<tr><td>Retires</td><td>${esc(e.retires)}</td></tr>` : ""}</table>
        <div style="margin-top:14px">${bars(e.domains.map(([n, w]) => [n, "", w]))}</div>
        <p class="small muted" style="margin-top:16px">${lessonCount(e.code)} of ${objCount(e.code)} objectives have lessons.${lessonCount(e.code) < objCount(e.code) ? " Ask Claude in the project to research and write the next domain when you need it." : ""}</p>
        <div class="row">${e.code === activeCode ? `<span class="small muted">You're studying this exam.</span>` : `<button class="btn primary" data-study="${e.code}">Study ${e.code}</button>`}</div>`).join("")}
      ${c.note ? `<p class="small muted" style="margin-top:20px">${esc(c.note)}</p>` : ""}
      <h2>Sources</h2><ul class="srcs" style="padding-left:20px"><li><a href="${c.official}" target="_blank" rel="noopener">CompTIA: official ${esc(c.name)} page and exam objectives</a></li>${c.free.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("")}</ul>`;
    $("#main").querySelectorAll("[data-study]").forEach(b => b.onclick = () => { try { localStorage.setItem("certledger.active", b.dataset.study); } catch {} location.hash = "#/today"; location.reload(); });
    return;
  }
  const levels = [...new Set(CERTS.map(c => c.level))];
  $("#main").innerHTML = `<h1>Certifications</h1><p class="muted">Current CompTIA exams, checked on comptia.org. Lessons are written for one exam at a time, starting with the one you're studying.</p>
    ${levels.map(l => `<div class="dhead">${esc(l)}</div><div class="list">${CERTS.filter(c => c.level === l).map(c => `<a class="item" href="#/certs/${c.id}"><span class="t">${esc(c.name)}<small>${c.exams.map(e => e.code).join(", ")} · ${esc(c.for)}</small></span><span class="s">${c.exams.some(e => e.code === activeCode) ? "Studying" : c.exams.some(e => lessonCount(e.code)) ? "Lessons started" : ""}</span></a>`).join("")}</div>`).join("")}`;
}

// ---------- Progress ----------
function viewProgress() {
  const days = Object.keys(S.days).sort(), qs = OBJS.filter(o => S.quiz[o.id]);
  $("#main").innerHTML = `<h1>Progress</h1><p class="muted">${days.length} study day${days.length === 1 ? "" : "s"}${days[0] ? " since " + days[0] : ""}.</p>
    <h2>Readiness</h2>${readinessBlock()}
    <h2>Quizzes</h2><div class="list">${qs.length ? qs.map(o => { const q = S.quiz[o.id]; return `<div class="item"><span class="c">${o.id}</span><span class="t">${esc(o.short)}</span><span class="s">last ${q.last}% · best ${q.best}%</span></div>`; }).join("") : `<p class="muted small" style="padding-top:12px">No quizzes yet.</p>`}</div>
    ${DIAG ? `<h2>Diagnostic</h2><p class="small"><a class="link" href="#/diag">${S.diag ? "See result from " + S.diag.date : "Not taken yet"}</a></p>` : ""}
    <h2>Back up</h2><p class="small muted">Progress lives in this browser only.</p>
    <div class="row"><button class="btn" id="ex">Export</button><label class="btn">Import<input type="file" id="im" accept=".json" hidden></label><button class="btn" id="rs">Reset</button></div>`;
  $("#ex").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })); a.download = `cert-ledger-${activeCode}-${today()}.json`; a.click(); };
  $("#im").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { try { S = Object.assign(S, JSON.parse(t)); save(); toast("Imported"); render(); } catch { toast("That isn't a Cert Ledger export"); } }); };
  $("#rs").onclick = () => { if (confirm("Delete all progress for " + activeCode + " in this browser?")) { localStorage.removeItem(KEY); location.reload(); } };
}

render();
})();
</script>
